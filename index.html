<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Paper Trail</title>
<style>
  :root{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    line-height:1.4;
    color:#222;
  }
  body{
    max-width:960px;
    margin:24px auto;
    padding:16px 16px 24px;
    background:#f5f7fa;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  header .title{
    font-size:18px;
    font-weight:600;
  }
  header .subtitle{
    font-size:12px;
    color:#667;
  }
  .pill-row{
    display:flex;
    gap:6px;
    font-size:11px;
    color:#667;
  }
  .pill{
    padding:3px 8px;
    border-radius:999px;
    border:1px solid #dde3f0;
    background:#fff;
  }
  .card{
    background:#fff;
    border-radius:12px;
    border:1px solid #dde3f0;
    padding:12px;
    margin-bottom:12px;
  }
  .card h2{
    margin:0 0 6px;
    font-size:14px;
    font-weight:600;
  }
  .card p{
    margin:4px 0;
    font-size:12px;
    color:#445;
  }
  button{
    padding:8px 12px;
    border-radius:999px;
    border:1px solid #cfd6e3;
    background:#fff;
    font-size:12px;
    cursor:pointer;
  }
  button.primary{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
  }
  button.ghost{
    background:transparent;
  }
  input[type="search"]{
    width:100%;
    padding:8px 10px;
    border-radius:999px;
    border:1px solid #dde3f0;
    font-size:12px;
    margin-bottom:8px;
    background:#fff;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .chip{
    padding:4px 10px;
    border-radius:999px;
    border:1px solid #dde3f0;
    background:#fff;
    font-size:11px;
    cursor:pointer;
  }
  .chip.active{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
  }
  .status-row{
    display:flex;
    gap:6px;
    margin-top:4px;
  }
  .status-dot{
    width:8px;
    height:8px;
    border-radius:999px;
    display:inline-block;
    margin-right:4px;
  }
  .status-dot.pending{background:#f97316;}
  .status-dot.synced{background:#22c55e;}
  #output{
    font-size:12px;
    color:#445;
    margin-top:6px;
  }
  #grid{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px;
  }
  .item-card{
    background:#fff;
    border-radius:10px;
    border:1px solid #dde3f0;
    padding:8px;
    font-size:11px;
  }
  .item-name{
    font-weight:600;
    margin-bottom:4px;
    word-break:break-all;
  }
  .item-meta{
    color:#667;
    margin-bottom:4px;
  }
  .item-category{
    font-size:10px;
    padding:2px 6px;
    border-radius:999px;
    border:1px solid #dde3f0;
    display:inline-block;
    margin-top:2px;
  }
  .empty{
    text-align:center;
    padding:24px 12px;
    color:#667;
    font-size:12px;
  }
  .empty-icon{
    font-size:32px;
    margin-bottom:8px;
  }
  .bottom-bar{
    margin-top:16px;
    display:flex;
    justify-content:space-around;
    padding:10px 8px;
    border-radius:999px;
    border:1px solid #dde3f0;
    background:#fff;
    font-size:11px;
  }
  .bottom-cat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  .bottom-circle{
    width:28px;
    height:28px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    border:1px solid #dde3f0;
    background:#f9fafb;
  }
  footer{
    margin-top:16px;
    font-size:11px;
    color:#667;
  }
  input[type="file"]{display:none;}
  .preview{
    margin-top:8px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .preview img{
    max-width:120px;
    border-radius:8px;
    border:1px solid #dde3f0;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel CDN -->
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const HANDLE_KEY = 'papertrail_onedrive_folder_v1';
const DB = 'papertrail-onedrive';
const STORE = 'handles';

function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = ()=>r.result.createObjectStore(STORE);
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function idbPut(key,value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(value,key);
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
  });
}

function guessCategory(name){
  const n = name.toLowerCase();
  if(n.includes('receipt')) return 'Receipt';
  if(n.includes('card')) return 'Card';
  if(n.includes('id')) return 'ID';
  if(n.includes('warranty')) return 'Warranty';
  return 'Misc';
}

function App(){
  const [dirHandle,setDirHandle] = useState(null);
  const [items,setItems] = useState([]);
  const [output,setOutput] = useState('');
  const [activeCat,setActiveCat] = useState('all');
  const [activeStatus,setActiveStatus] = useState('any');
  const [query,setQuery] = useState('');
  const [snapCategory,setSnapCategory] = useState(null);
  const [snapFile,setSnapFile] = useState(null);
  const [snapPreview,setSnapPreview] = useState(null);
  const fileInputRef = useRef(null);
  const snapInputRef = useRef(null);

  useEffect(()=>{
    restoreHandle();
  },[]);

  async function restoreHandle(){
    if(!('showDirectoryPicker' in window)){
      setOutput('Folder picker only works on Chrome/Edge desktop. Mobile uses Share → OneDrive → Apps/PaperTrail.');
      return;
    }
    try{
      const stored = await idbGet(HANDLE_KEY);
      if(stored){
        setDirHandle(stored);
        setOutput('Folder connected. Upload files or tap Refresh to see items.');
        await refresh(stored);
      }else{
        setOutput('No folder connected. Tap “Connect folder” and choose your local OneDrive Apps/PaperTrail folder.');
      }
    }catch(e){
      console.warn('restoreHandle failed',e);
    }
  }

  async function pickFolder(){
    if(!('showDirectoryPicker' in window)){
      setOutput('Folder picker not supported in this browser. Use Chrome/Edge on desktop.');
      return;
    }
    try{
      const handle = await window.showDirectoryPicker();
      setDirHandle(handle);
      await idbPut(HANDLE_KEY,handle);
      setOutput('Folder connected.');
      await refresh(handle);
    }catch(e){
      setOutput(`Folder pick cancelled or failed: ${e.message}`);
    }
  }

  async function clearFolder(){
    setDirHandle(null);
    await idbDel(HANDLE_KEY);
    setItems([]);
    setOutput('Folder connection cleared.');
  }

  async function uploadFiles(files){
    if(!dirHandle){
      setOutput('No folder connected. Connect a folder first.');
      return;
    }
    try{
      const perm = await dirHandle.requestPermission({mode:'readwrite'});
      if(perm==='denied') throw new Error('Permission denied for folder');
      let count = 0;
      const newItems = [...items];
      for(const file of files){
        const fh = await dirHandle.getFileHandle(file.name,{create:true});
        const writable = await fh.createWritable();
        await writable.write(file);
        await writable.close();
        const now = new Date();
        newItems.push({
          name:file.name,
          size:file.size,
          type:file.type,
          category:guessCategory(file.name),
          status:'pending',
          date:now.toISOString().slice(0,10)
        });
        count++;
      }
      setItems(newItems);
      setOutput(`Uploaded ${count} file(s) into ${dirHandle.name}.`);
    }catch(e){
      setOutput(`Upload failed: ${e.message}`);
    }
  }

  async function refresh(handleOverride){
    const handle = handleOverride || dirHandle;
    if(!handle){
      setItems([]);
      return;
    }
    try{
      const perm = await handle.requestPermission({mode:'read'});
      if(perm==='denied') throw new Error('Permission denied for folder');
      const newItems = [];
      for await (const entry of handle.values()){
        if(entry.kind==='file'){
          const file = await entry.getFile();
          newItems.push({
            name:file.name,
            size:file.size,
            type:file.type,
            category:guessCategory(file.name),
            status:'synced',
            date:file.lastModified ? new Date(file.lastModified).toISOString().slice(0,10) : ''
          });
        }
      }
      setItems(newItems);
      setOutput(`Loaded ${newItems.length} item(s) from ${handle.name}.`);
    }catch(e){
      setOutput(`Refresh failed: ${e.message}`);
    }
  }

  function filteredItems(){
    let list = [...items];
    if(activeCat!=='all'){
      list = list.filter(i=>i.category===activeCat);
    }
    if(activeStatus!=='any'){
      list = list.filter(i=>i.status===activeStatus);
    }
    if(query){
      const q = query.toLowerCase();
      list = list.filter(i=>i.name.toLowerCase().includes(q) || (i.date||'').includes(q));
    }
    return list;
  }

  const total = items.length;
  const pendingCount = items.filter(i=>i.status==='pending').length;

  function onBottomCatClick(cat){
    setActiveCat(cat);
    // mobile snap: open camera
    setSnapCategory(cat);
    if(snapInputRef.current){
      snapInputRef.current.click();
    }
  }

  function onSnapChange(e){
    const file = e.target.files?.[0];
    if(!file) return;
    setSnapFile(file);
    const url = URL.createObjectURL(file);
    setSnapPreview(url);
  }

  async function shareSnap(){
    if(!snapFile){
      setOutput('No snapped image to share.');
      return;
    }
    if(navigator.share && navigator.canShare && navigator.canShare({ files:[snapFile] })){
      try{
        await navigator.share({
          files:[snapFile],
          title:'Paper Trail',
          text:'Upload to OneDrive Apps/PaperTrail'
        });
        setOutput('Shared to OneDrive (or chosen app). After sync, open desktop and Refresh.');
      }catch(e){
        setOutput(`Share cancelled or failed: ${e.message}`);
      }
    }else{
      setOutput('Share API not supported. Use your gallery’s Share → OneDrive → Apps/PaperTrail.');
    }
  }

  return (
    <>
      <header>
        <div>
          <div className="title">Paper Trail</div>
          <div className="subtitle">snap · sort · sync</div>
        </div>
        <div className="pill-row">
          <span className="pill">OneDrive</span>
          <span className="pill">Apps/PaperTrail</span>
        </div>
      </header>

      <div className="card">
        <h2>Connect folder</h2>
        <p>
          Desktop: connect your local OneDrive folder where files sync:<br/>
          <strong>OneDrive/Apps/PaperTrail</strong><br/><br/>
          Mobile: snap a photo, then use <strong>Share → OneDrive → Apps/PaperTrail</strong>.  
          After OneDrive syncs, tap Refresh here to see them.
        </p>
        <div style={{marginTop:8, display:'flex', alignItems:'center', gap:8}}>
          <button className="primary" onClick={pickFolder}>Connect folder</button>
          <button className="ghost" onClick={clearFolder}>Clear</button>
          <span style={{fontSize:12, color:'#667'}}>
            {dirHandle ? `Connected: ${dirHandle.name}` : ''}
          </span>
        </div>
        <div id="output">{output}</div>
      </div>

      <div className="card">
        <input
          type="search"
          placeholder="Search by filename or date…"
          value={query}
          onChange={e=>setQuery(e.target.value)}
        />
        <div className="filters">
          {['all','Receipt','Card','ID','Warranty','Misc'].map(cat=>(
            <span
              key={cat}
              className={'chip' + (activeCat===cat ? ' active' : '')}
              data-cat={cat}
              onClick={()=>setActiveCat(cat)}
            >
              {cat==='all' ? 'All' : cat}
            </span>
          ))}
        </div>
        <div className="status-row">
          {['any','pending','synced'].map(st=>(
            <span
              key={st}
              className={'chip' + (activeStatus===st ? ' active' : '')}
              data-status={st}
              onClick={()=>setActiveStatus(st)}
            >
              {st==='any' ? 'Any status' : (
                <>
                  <span className={'status-dot ' + (st==='pending'?'pending':'synced')}></span>
                  {st==='pending'?'Pending':'Synced'}
                </>
              )}
            </span>
          ))}
        </div>
        <div style={{marginTop:8, display:'flex', gap:8}}>
          <button className="primary" onClick={()=>fileInputRef.current?.click()}>Upload files</button>
          <button onClick={()=>refresh()}>Refresh</button>
          <input
            ref={fileInputRef}
            type="file"
            multiple
            accept="image/*,application/pdf"
            onChange={e=>{
              const files = Array.from(e.target.files||[]);
              if(files.length) uploadFiles(files);
              e.target.value = '';
            }}
          />
        </div>

        {snapPreview && (
          <div className="preview">
            <img src={snapPreview} alt="Snap preview" />
            <div style={{fontSize:12}}>
              <div><strong>{snapCategory || 'Snap'}</strong></div>
              <div style={{marginTop:4}}>
                <button className="primary" onClick={shareSnap}>Share to OneDrive</button>
              </div>
            </div>
          </div>
        )}

        <input
          ref={snapInputRef}
          type="file"
          accept="image/*"
          capture="environment"
          onChange={onSnapChange}
        />
      </div>

      <div id="grid">
        {filteredItems().map((i,idx)=>(
          <div key={idx} className="item-card">
            <div className="item-name">{i.name}</div>
            <div className="item-meta">
              {(i.type || 'unknown') + ' • ' + (i.size/1024).toFixed(1) + ' KB'}
            </div>
            {i.date && <div className="item-meta">{i.date}</div>}
            <div className="item-category">{i.category || 'Misc'}</div>
            <div className="item-meta">
              <span className={'status-dot ' + (i.status==='pending'?'pending':'synced')}></span>
              {i.status==='pending'?'Pending':'Synced'}
            </div>
          </div>
        ))}
      </div>

      {filteredItems().length===0 && (
        <div id="emptyState" className="empty">
          <div className="empty-icon">📦</div>
          <div>Nothing filed yet.</div>
          <div>Tap a category below to snap your first item.</div>
          <div style={{marginTop:6}}>{total} total · {pendingCount} pending sync</div>
        </div>
      )}

      <div className="bottom-bar">
        {[
          {cat:'Receipt', icon:'🧾'},
          {cat:'Card', icon:'💳'},
          {cat:'ID', icon:'🪪'},
          {cat:'Warranty', icon:'🔧'},
          {cat:'Misc', icon:'📦'},
        ].map(c=>(
          <div
            key={c.cat}
            className="bottom-cat"
            data-cat={c.cat}
            onClick={()=>onBottomCatClick(c.cat)}
          >
            <div className="bottom-circle">{c.icon}</div>
            <div>{c.cat}</div>
          </div>
        ))}
      </div>

      <footer>
        <small>
          Mobile: snap with the category buttons, then Share → OneDrive → Apps/PaperTrail.<br/>
          Desktop: connect your local OneDrive Apps/PaperTrail folder and tap Refresh to see mobile uploads.
        </small>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
