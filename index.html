<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Paper Trail</title>
<style>
  :root{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    line-height:1.4;
    color:#222;
  }
  body{
    max-width:960px;
    margin:24px auto;
    padding:16px 16px 24px;
    background:#f5f7fa;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  header .title{
    font-size:18px;
    font-weight:600;
  }
  header .subtitle{
    font-size:12px;
    color:#667;
  }
  .pill-row{
    display:flex;
    gap:6px;
    font-size:11px;
    color:#667;
  }
  .pill{
    padding:3px 8px;
    border-radius:999px;
    border:1px solid #dde3f0;
    background:#fff;
  }
  .card{
    background:#fff;
    border-radius:12px;
    border:1px solid #dde3f0;
    padding:12px;
    margin-bottom:12px;
  }
  .card h2{
    margin:0 0 6px;
    font-size:14px;
    font-weight:600;
  }
  .card p{
    margin:4px 0;
    font-size:12px;
    color:#445;
  }
  button{
    padding:8px 12px;
    border-radius:999px;
    border:1px solid #cfd6e3;
    background:#fff;
    font-size:12px;
    cursor:pointer;
  }
  button.primary{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
  }
  button.ghost{
    background:transparent;
  }
  input[type="search"]{
    width:100%;
    padding:8px 10px;
    border-radius:999px;
    border:1px solid #dde3f0;
    font-size:12px;
    margin-bottom:8px;
    background:#fff;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .chip{
    padding:4px 10px;
    border-radius:999px;
    border:1px solid #dde3f0;
    background:#fff;
    font-size:11px;
    cursor:pointer;
  }
  .chip.active{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
  }
  .status-row{
    display:flex;
    gap:6px;
    margin-top:4px;
  }
  .status-dot{
    width:8px;
    height:8px;
    border-radius:999px;
    display:inline-block;
    margin-right:4px;
  }
  .status-dot.pending{background:#f97316;}
  .status-dot.synced{background:#22c55e;}
  #output{
    font-size:12px;
    color:#445;
    margin-top:6px;
  }
  #grid{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .month-section{
    background:#fff;
    border-radius:10px;
    border:1px solid #dde3f0;
    padding:8px;
  }
  .month-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:12px;
  }
  .month-title{
    font-weight:600;
  }
  .thumb-grid{
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .thumb-card{
    width:100px;
    font-size:10px;
  }
  .thumb-card img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid #dde3f0;
    display:block;
    margin-bottom:4px;
  }
  .thumb-name{
    word-break:break-all;
    margin-bottom:2px;
  }
  .thumb-category{
    font-size:9px;
    padding:2px 6px;
    border-radius:999px;
    border:1px solid #dde3f0;
    display:inline-block;
  }
  .empty{
    text-align:center;
    padding:24px 12px;
    color:#667;
    font-size:12px;
  }
  .empty-icon{
    font-size:32px;
    margin-bottom:8px;
  }
  .bottom-bar{
    margin-top:16px;
    display:flex;
    justify-content:space-around;
    padding:10px 8px;
    border-radius:999px;
    border:1px solid #dde3f0;
    background:#fff;
    font-size:11px;
  }
  .bottom-cat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  .bottom-circle{
    width:28px;
    height:28px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    border:1px solid #dde3f0;
    background:#f9fafb;
  }
  footer{
    margin-top:16px;
    font-size:11px;
    color:#667;
  }
  .camera-modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.9);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:50;
    color:#f9fafb;
  }
  .camera-header{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 12px;
    box-sizing:border-box;
  }
  .camera-body{
    width:100%;
    max-width:480px;
    padding:8px 12px 16px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .camera-video{
    width:100%;
    max-width:480px;
    border-radius:12px;
    overflow:hidden;
    background:#000;
  }
  .camera-video video{
    width:100%;
    height:auto;
    display:block;
  }
  .camera-controls{
    margin-top:8px;
    display:flex;
    justify-content:center;
    gap:12px;
  }
  .camera-preview{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .camera-preview img{
    max-width:200px;
    border-radius:12px;
    border:1px solid #334155;
  }
  .camera-badge{
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    border:1px solid #334155;
  }
  .item-modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:60;
  }
  .item-modal-inner{
    background:#fff;
    border-radius:12px;
    padding:12px;
    max-width:360px;
    width:90%;
    font-size:12px;
  }
  .item-modal-inner img{
    width:100%;
    max-height:260px;
    object-fit:contain;
    border-radius:8px;
    margin-bottom:8px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const HANDLE_KEY = 'papertrail_onedrive_folder_v1';
const DB = 'papertrail-onedrive';
const STORE = 'handles';

function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = ()=>r.result.createObjectStore(STORE);
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function idbPut(key,value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(value,key);
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = ()=>res();
    tx.onerror = ()=>rej(tx.error);
  });
}

function guessCategoryFromName(name){
  const n = name.toLowerCase();
  if(n.startsWith('receipt-')) return 'Receipt';
  if(n.startsWith('card-')) return 'Card';
  if(n.startsWith('id-')) return 'ID';
  if(n.startsWith('warranty-')) return 'Warranty';
  if(n.includes('receipt')) return 'Receipt';
  if(n.includes('card')) return 'Card';
  if(n.includes('id')) return 'ID';
  if(n.includes('warranty')) return 'Warranty';
  return 'Misc';
}

function monthLabel(monthKey){
  // monthKey: "2024-08"
  const [y,m] = monthKey.split('-');
  const date = new Date(Number(y), Number(m)-1, 1);
  return date.toLocaleString(undefined,{ month:'long', year:'numeric' });
}

function extractMonthFromDate(dateStr){
  // dateStr: "2024-08-16"
  if(!dateStr || dateStr.length < 7) return 'Unknown';
  return dateStr.slice(0,7); // "YYYY-MM"
}

function parseDateFromFilename(name){
  // receipt-2024-08-16T22-10-55-123Z.jpg
  const parts = name.split('-');
  if(parts.length < 4) return '';
  const year = parts[1];
  const month = parts[2];
  const day = parts[3].split('T')[0];
  if(!year || !month || !day) return '';
  return `${year}-${month}-${day}`;
}

function CameraModal({ category, onClose, onCaptured }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const [stream,setStream] = useState(null);
  const [previewUrl,setPreviewUrl] = useState(null);
  const [capturedFile,setCapturedFile] = useState(null);
  const [message,setMessage] = useState('');

  useEffect(()=>{
    let active = true;
    async function start(){
      try{
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        if(!active) return;
        setStream(s);
        if(videoRef.current){
          videoRef.current.srcObject = s;
          videoRef.current.play();
        }
      }catch(e){
        setMessage('Camera access failed. Use your phone camera and Share → OneDrive → Apps/PaperTrail.');
      }
    }
    start();
    return ()=>{
      active = false;
      if(stream){
        stream.getTracks().forEach(t=>t.stop());
      }
    };
  },[]);

  function capture(){
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if(!video || !canvas){
      setMessage('No video stream. Use your phone camera instead.');
      return;
    }
    const w = video.videoWidth;
    const h = video.videoHeight;
    if(!w || !h){
      setMessage('Camera not ready yet. Try again.');
      return;
    }
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video,0,0,w,h);
    canvas.toBlob(blob=>{
      if(!blob){
        setMessage('Capture failed. Try again.');
        return;
      }
      const iso = new Date().toISOString().replace(/[:.]/g,'-');
      const fileName = `${category.toLowerCase()}-${iso}.jpg`;
      const file = new File([blob], fileName, { type:'image/jpeg' });
      setCapturedFile(file);
      const url = URL.createObjectURL(blob);
      setPreviewUrl(url);
      onCaptured && onCaptured({ file, url, category, fileName });
    },'image/jpeg',0.9);
  }

  async function share(){
    if(!capturedFile){
      setMessage('No captured image to share.');
      return;
    }
    if(navigator.share && navigator.canShare && navigator.canShare({ files:[capturedFile] })){
      try{
        await navigator.share({
          files:[capturedFile],
          title:'Paper Trail',
          text:'Upload to OneDrive Apps/PaperTrail'
        });
        setMessage('Shared. After OneDrive syncs, open desktop and tap Refresh.');
      }catch(e){
        setMessage(`Share cancelled or failed: ${e.message}`);
      }
    }else{
      setMessage('Share API not supported. Use your gallery’s Share → OneDrive → Apps/PaperTrail.');
    }
  }

  return (
    <div className="camera-modal">
      <div className="camera-header">
        <div style={{fontSize:13}}>Snap · {category}</div>
        <button className="ghost" onClick={onClose}>Close</button>
      </div>
      <div className="camera-body">
        <div className="camera-video">
          <video ref={videoRef} playsInline muted />
        </div>
        <canvas ref={canvasRef} style={{display:'none'}} />
        <div className="camera-controls">
          <button className="primary" onClick={capture}>Capture</button>
          {capturedFile && (
            <button onClick={share}>Share to OneDrive</button>
          )}
        </div>
        {previewUrl && (
          <div className="camera-preview">
            <img src={previewUrl} alt="Captured" />
            <div className="camera-badge">{category}</div>
          </div>
        )}
        {message && (
          <div style={{fontSize:11, marginTop:4}}>{message}</div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [dirHandle,setDirHandle] = useState(null);
  const [items,setItems] = useState([]);
  const [output,setOutput] = useState('');
  const [activeCat,setActiveCat] = useState('all');
  const [activeStatus,setActiveStatus] = useState('any');
  const [query,setQuery] = useState('');
  const [cameraCategory,setCameraCategory] = useState(null);
  const [expandedMonths,setExpandedMonths] = useState(new Set());
  const [selectedItem,setSelectedItem] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(()=>{
    restoreHandle();
  },[]);

  async function restoreHandle(){
    if(!('showDirectoryPicker' in window)){
      setOutput('Folder picker only works on Chrome/Edge desktop. Mobile uses Share → OneDrive → Apps/PaperTrail.');
      return;
    }
    try{
      const stored = await idbGet(HANDLE_KEY);
      if(stored){
        setDirHandle(stored);
        setOutput('Folder connected. Upload files or tap Refresh to see items.');
        await refresh(stored);
      }else{
        setOutput('No folder connected. Tap “Connect folder” and choose your local OneDrive Apps/PaperTrail folder.');
      }
    }catch(e){
      console.warn('restoreHandle failed',e);
    }
  }

  async function pickFolder(){
    if(!('showDirectoryPicker' in window)){
      setOutput('Folder picker not supported in this browser. Use Chrome/Edge on desktop.');
      return;
    }
    try{
      const handle = await window.showDirectoryPicker();
      setDirHandle(handle);
      await idbPut(HANDLE_KEY,handle);
      setOutput('Folder connected.');
      await refresh(handle);
    }catch(e){
      setOutput(`Folder pick cancelled or failed: ${e.message}`);
    }
  }

  async function clearFolder(){
    setDirHandle(null);
    await idbDel(HANDLE_KEY);
    setItems([]);
    setOutput('Folder connection cleared.');
  }

  async function uploadFiles(files){
    if(!dirHandle){
      setOutput('No folder connected. Connect a folder first.');
      return;
    }
    try{
      const perm = await dirHandle.requestPermission({mode:'readwrite'});
      if(perm==='denied') throw new Error('Permission denied for folder');
      let count = 0;
      const newItems = [...items];
      for(const file of files){
        const fh = await dirHandle.getFileHandle(file.name,{create:true});
        const writable = await fh.createWritable();
        await writable.write(file);
        await writable.close();
        const now = new Date();
        const dateStr = now.toISOString().slice(0,10);
        const monthKey = extractMonthFromDate(dateStr);
        const previewUrl = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
        newItems.push({
          name:file.name,
          size:file.size,
          type:file.type,
          category:guessCategoryFromName(file.name),
          status:'pending',
          date:dateStr,
          month:monthKey,
          previewUrl
        });
        count++;
      }
      setItems(newItems);
      setOutput(`Uploaded ${count} file(s) into ${dirHandle.name}.`);
    }catch(e){
      setOutput(`Upload failed: ${e.message}`);
    }
  }

  async function refresh(handleOverride){
    const handle = handleOverride || dirHandle;
    if(!handle){
      setItems([]);
      return;
    }
    try{
      const perm = await handle.requestPermission({mode:'read'});
      if(perm==='denied') throw new Error('Permission denied for folder');
      const newItems = [];
      for await (const entry of handle.values()){
        if(entry.kind==='file'){
          const file = await entry.getFile();
          const name = file.name;
          let dateStr = parseDateFromFilename(name);
          if(!dateStr && file.lastModified){
            dateStr = new Date(file.lastModified).toISOString().slice(0,10);
          }
          const monthKey = extractMonthFromDate(dateStr);
          const previewUrl = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
          newItems.push({
            name,
            size:file.size,
            type:file.type,
            category:guessCategoryFromName(name),
            status:'synced',
            date:dateStr,
            month:monthKey,
            previewUrl
          });
        }
      }
      setItems(newItems);
      setOutput(`Loaded ${newItems.length} item(s) from ${handle.name}.`);
    }catch(e){
      setOutput(`Refresh failed: ${e.message}`);
    }
  }

  function filteredItems(){
    let list = [...items];
    if(activeCat!=='all'){
      list = list.filter(i=>i.category===activeCat);
    }
    if(activeStatus!=='any'){
      list = list.filter(i=>i.status===activeStatus);
    }
    if(query){
      const q = query.toLowerCase();
      list = list.filter(i=>i.name.toLowerCase().includes(q) || (i.date||'').includes(q));
    }
    return list;
  }

  function groupedByMonth(){
    const list = filteredItems();
    const groups = {};
    for(const i of list){
      const key = i.month || 'Unknown';
      if(!groups[key]) groups[key] = [];
      groups[key].push(i);
    }
    return groups;
  }

  const total = items.length;
  const pendingCount = items.filter(i=>i.status==='pending').length;

  function onBottomCatClick(cat){
    setActiveCat(cat);
    setCameraCategory(cat);
  }

  function onCapturedSnap({ file, url, category, fileName }){
    // Mobile flow: file is shared via OneDrive; desktop will see it after sync.
    // We don't add it to items here because it lives in OneDrive, not local.
  }

  function toggleMonth(key){
    const next = new Set(expandedMonths);
    if(next.has(key)) next.delete(key);
    else next.add(key);
    setExpandedMonths(next);
  }

  function openItemModal(item){
    setSelectedItem(item);
  }

  function closeItemModal(){
    setSelectedItem(null);
  }

  return (
    <>
      <header>
        <div>
          <div className="title">Paper Trail</div>
          <div className="subtitle">snap · sort · sync</div>
        </div>
        <div className="pill-row">
          <span className="pill">OneDrive</span>
          <span className="pill">Apps/PaperTrail</span>
        </div>
      </header>

      <div className="card">
        <h2>Connect folder</h2>
        <p>
          Desktop: connect your local OneDrive folder where files sync:<br/>
          <strong>OneDrive/Apps/PaperTrail</strong><br/><br/>
          Mobile: snap a photo, then use <strong>Share → OneDrive → Apps/PaperTrail</strong>.  
          After OneDrive syncs, tap Refresh here to see them.
        </p>
        <div style={{marginTop:8, display:'flex', alignItems:'center', gap:8}}>
          <button className="primary" onClick={pickFolder}>Connect folder</button>
          <button className="ghost" onClick={clearFolder}>Clear</button>
          <span style={{fontSize:12, color:'#667'}}>
            {dirHandle ? `Connected: ${dirHandle.name}` : ''}
          </span>
        </div>
        <div id="output">{output}</div>
      </div>

      <div className="card">
        <input
          type="search"
          placeholder="Search by filename or date…"
          value={query}
          onChange={e=>setQuery(e.target.value)}
        />
        <div className="filters">
          {['all','Receipt','Card','ID','Warranty','Misc'].map(cat=>(
            <span
              key={cat}
              className={'chip' + (activeCat===cat ? ' active' : '')}
              data-cat={cat}
              onClick={()=>setActiveCat(cat)}
            >
              {cat==='all' ? 'All' : cat}
            </span>
          ))}
        </div>
        <div className="status-row">
          {['any','pending','synced'].map(st=>(
            <span
              key={st}
              className={'chip' + (activeStatus===st ? ' active' : '')}
              data-status={st}
              onClick={()=>setActiveStatus(st)}
            >
              {st==='any' ? 'Any status' : (
                <>
                  <span className={'status-dot ' + (st==='pending'?'pending':'synced')}></span>
                  {st==='pending'?'Pending':'Synced'}
                </>
              )}
            </span>
          ))}
        </div>
        <div style={{marginTop:8, display:'flex', gap:8}}>
          <button className="primary" onClick={()=>fileInputRef.current?.click()}>Upload files</button>
          <button onClick={()=>refresh()}>Refresh</button>
          <input
            ref={fileInputRef}
            type="file"
            multiple
            accept="image/*,application/pdf"
            onChange={e=>{
              const files = Array.from(e.target.files||[]);
              if(files.length) uploadFiles(files);
              e.target.value = '';
            }}
          />
        </div>
      </div>

      <div id="grid">
        {Object.entries(groupedByMonth()).map(([monthKey, list])=>(
          <div key={monthKey} className="month-section">
            <div className="month-header" onClick={()=>toggleMonth(monthKey)}>
              <span className="month-title">{monthLabel(monthKey)}</span>
              <span style={{fontSize:11, color:'#667'}}>
                {list.length} item{list.length!==1?'s':''} · {expandedMonths.has(monthKey) ? '▼' : '▸'}
              </span>
            </div>
            {expandedMonths.has(monthKey) && (
              <div className="thumb-grid">
                {list.map((i,idx)=>(
                  <div key={idx} className="thumb-card" onClick={()=>openItemModal(i)}>
                    {i.previewUrl && (
                      <img src={i.previewUrl} alt={i.name} />
                    )}
                    <div className="thumb-name">{i.name}</div>
                    <div className="thumb-category">{i.category}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>

      {filteredItems().length===0 && (
        <div id="emptyState" className="empty">
          <div className="empty-icon">📦</div>
          <div>Nothing filed yet.</div>
          <div>Tap a category below to snap your first item.</div>
          <div style={{marginTop:6}}>{total} total · {pendingCount} pending sync</div>
        </div>
      )}

      <div className="bottom-bar">
        {[
          {cat:'Receipt', icon:'🧾'},
          {cat:'Card', icon:'💳'},
          {cat:'ID', icon:'🪪'},
          {cat:'Warranty', icon:'🔧'},
          {cat:'Misc', icon:'📦'},
        ].map(c=>(
          <div
            key={c.cat}
            className="bottom-cat"
            data-cat={c.cat}
            onClick={()=>onBottomCatClick(c.cat)}
          >
            <div className="bottom-circle">{c.icon}</div>
            <div>{c.cat}</div>
          </div>
        ))}
      </div>

      <footer>
        <small>
          Mobile: use the bottom categories to open the camera, capture, then Share → OneDrive → Apps/PaperTrail.<br/>
          Desktop: connect your local OneDrive Apps/PaperTrail folder and tap Refresh to see mobile uploads, grouped by month.
        </small>
      </footer>

      {cameraCategory && (
        <CameraModal
          category={cameraCategory}
          onClose={()=>setCameraCategory(null)}
          onCaptured={onCapturedSnap}
        />
      )}

      {selectedItem && (
        <div className="item-modal" onClick={closeItemModal}>
          <div className="item-modal-inner" onClick={e=>e.stopPropagation()}>
            {selectedItem.previewUrl && (
              <img src={selectedItem.previewUrl} alt={selectedItem.name} />
            )}
            <div><strong>{selectedItem.name}</strong></div>
            <div style={{marginTop:4}}>
              {selectedItem.type || 'unknown'} • {(selectedItem.size/1024).toFixed(1)} KB
            </div>
            {selectedItem.date && (
              <div style={{marginTop:2}}>Date: {selectedItem.date}</div>
            )}
            <div style={{marginTop:2}}>
              Category: <span className="thumb-category">{selectedItem.category}</span>
            </div>
            <div style={{marginTop:2}}>
              Status:{' '}
              <span className={'status-dot ' + (selectedItem.status==='pending'?'pending':'synced')}></span>
              {selectedItem.status==='pending'?'Pending':'Synced'}
            </div>
            <div style={{marginTop:8, textAlign:'right'}}>
              <button onClick={closeItemModal}>Close</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
